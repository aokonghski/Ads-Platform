services:
  db:
    image: postgres:18
    container_name: ads-postgres
    restart: always

    #The container will use these variables 
    environment:
      POSTGRES_DB: ads_platform
      POSTGRES_USER: ads_user
      POSTGRES_PASSWORD: ads_password

    #Expose ports for service discovery
    ports:
      - '5432:5432'

    #Persists data outside of the container and mounts it to a local file directory
    #Since containers are ephemeral db services need persistent storage elsewhere
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}' ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    #Because an image isn't specified this will look for a Dockerfile in the directory
    build: .
    container_name: ads-platform

    #The web service needs the db service to report healthy before deploying
    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - '8000:8000'

volumes:
  postgres_data:
